services:
  - type: web
    name: agro-livestock
    runtime: node
    plan: free
    buildCommand: npm run build:render
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: VITE_API_URL
        value: /api
      - key: UPLOAD_DIR
        value: /tmp/agro-livestock/profile-pictures
      - key: DATABASE_PATH
        value: /tmp/agro-livestock/agro.sqlite
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
